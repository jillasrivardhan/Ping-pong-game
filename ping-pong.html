<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: 'Arial', sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: #fff;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .game-wrapper {
            position: relative;
            width: 800px;
            height: 400px;
            background: #000;
            border: 3px solid #fff;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .center-line {
            position: absolute;
            width: 2px;
            height: 100%;
            left: 50%;
            top: 0;
            background: repeating-linear-gradient(
                to bottom,
                #fff 0,
                #fff 10px,
                transparent 10px,
                transparent 20px
            );
            transform: translateX(-1px);
        }

        .paddle {
            position: absolute;
            width: 10px;
            height: 80px;
            background: #fff;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .paddle-left {
            left: 20px;
        }

        .paddle-right {
            right: 20px;
        }

        .ball {
            position: absolute;
            width: 15px;
            height: 15px;
            background: #00ff41;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff41, 0 0 20px rgba(0, 255, 65, 0.5);
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            position: absolute;
            width: 100%;
            top: 20px;
            color: #fff;
            font-size: 32px;
            font-weight: bold;
            z-index: 10;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
        }

        .score {
            flex: 1;
            text-align: center;
        }

        .score-label {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .instructions {
            color: #fff;
            margin-top: 20px;
            font-size: 14px;
        }

        .instructions p {
            margin: 5px 0;
        }

        .key {
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            color: #fff;
            z-index: 20;
            display: none;
            border: 2px solid #00ff41;
        }

        .game-over h2 {
            font-size: 36px;
            margin-bottom: 20px;
            color: #00ff41;
        }

        .game-over p {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .game-over button {
            background: #00ff41;
            color: #000;
            border: none;
            padding: 10px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .game-over button:hover {
            background: #00dd33;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 PONG GAME 🎮</h1>
        <div class="game-wrapper" id="gameWrapper">
            <div class="center-line"></div>
            <div class="scoreboard">
                <div class="score">
                    <div class="score-label">PLAYER</div>
                    <div id="playerScore">0</div>
                </div>
                <div class="score">
                    <div class="score-label">COMPUTER</div>
                    <div id="computerScore">0</div>
                </div>
            </div>
            <div class="paddle paddle-left" id="paddleLeft"></div>
            <div class="paddle paddle-right" id="paddleRight"></div>
            <div class="ball" id="ball"></div>
            <div class="game-over" id="gameOver">
                <h2>GAME OVER!</h2>
                <p id="gameOverMessage"></p>
                <button onclick="location.reload()">Play Again</button>
            </div>
        </div>
        <div class="instructions">
            <p>Control your paddle with <span class="key">MOUSE</span> or <span class="key">↑↓ ARROW KEYS</span></p>
            <p>First to 5 points wins!</p>
        </div>
    </div>

    <script>
        // Game variables
        const gameWrapper = document.getElementById('gameWrapper');
        const ball = document.getElementById('ball');
        const paddleLeft = document.getElementById('paddleLeft');
        const paddleRight = document.getElementById('paddleRight');
        const playerScoreDisplay = document.getElementById('playerScore');
        const computerScoreDisplay = document.getElementById('computerScore');
        const gameOverScreen = document.getElementById('gameOver');
        const gameOverMessage = document.getElementById('gameOverMessage');

        const GAME_WIDTH = 800;
        const GAME_HEIGHT = 400;
        const PADDLE_WIDTH = 10;
        const PADDLE_HEIGHT = 80;
        const BALL_SIZE = 15;
        const PADDLE_SPEED = 6;
        const BALL_SPEED = 4;
        const MAX_SCORE = 5;

        let gameState = {
            ballX: GAME_WIDTH / 2 - BALL_SIZE / 2,
            ballY: GAME_HEIGHT / 2 - BALL_SIZE / 2,
            ballSpeedX: BALL_SPEED * (Math.random() > 0.5 ? 1 : -1),
            ballSpeedY: BALL_SPEED * (Math.random() > 0.5 ? 1 : -1),
            paddleLeftY: GAME_HEIGHT / 2 - PADDLE_HEIGHT / 2,
            paddleRightY: GAME_HEIGHT / 2 - PADDLE_HEIGHT / 2,
            playerScore: 0,
            computerScore: 0,
            gameActive: true
        };

        const keys = {};

        // Event listeners
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        gameWrapper.addEventListener('mousemove', (e) => {
            const rect = gameWrapper.getBoundingClientRect();
            const mouseY = e.clientY - rect.top - PADDLE_HEIGHT / 2;
            gameState.paddleLeftY = Math.max(0, Math.min(mouseY, GAME_HEIGHT - PADDLE_HEIGHT));
        });

        // Update paddle position with arrow keys
        function updatePaddleWithKeys() {
            if (keys['ArrowUp'] && gameState.paddleLeftY > 0) {
                gameState.paddleLeftY -= PADDLE_SPEED;
            }
            if (keys['ArrowDown'] && gameState.paddleLeftY < GAME_HEIGHT - PADDLE_HEIGHT) {
                gameState.paddleLeftY += PADDLE_SPEED;
            }
        }

        // AI for right paddle
        function updateAI() {
            const paddleCenter = gameState.paddleRightY + PADDLE_HEIGHT / 2;
            const ballCenter = gameState.ballY + BALL_SIZE / 2;

            if (ballCenter < paddleCenter - 10) {
                if (gameState.paddleRightY > 0) {
                    gameState.paddleRightY -= PADDLE_SPEED - 1;
                }
            } else if (ballCenter > paddleCenter + 10) {
                if (gameState.paddleRightY < GAME_HEIGHT - PADDLE_HEIGHT) {
                    gameState.paddleRightY += PADDLE_SPEED - 1;
                }
            }
        }

        // Update ball position
        function updateBall() {
            gameState.ballX += gameState.ballSpeedX;
            gameState.ballY += gameState.ballSpeedY;

            // Wall collision (top and bottom)
            if (gameState.ballY <= 0 || gameState.ballY >= GAME_HEIGHT - BALL_SIZE) {
                gameState.ballSpeedY *= -1;
                gameState.ballY = Math.max(0, Math.min(gameState.ballY, GAME_HEIGHT - BALL_SIZE));
            }

            // Left paddle collision
            if (gameState.ballSpeedX < 0 &&
                gameState.ballX <= 30 &&
                gameState.ballY + BALL_SIZE >= gameState.paddleLeftY &&
                gameState.ballY <= gameState.paddleLeftY + PADDLE_HEIGHT) {
                gameState.ballSpeedX *= -1;
                gameState.ballX = 30;
                // Add spin based on where ball hits paddle
                const hitPos = (gameState.ballY + BALL_SIZE / 2) - (gameState.paddleLeftY + PADDLE_HEIGHT / 2);
                gameState.ballSpeedY += hitPos * 0.05;
            }

            // Right paddle collision
            if (gameState.ballSpeedX > 0 &&
                gameState.ballX >= GAME_WIDTH - 30 - BALL_SIZE &&
                gameState.ballY + BALL_SIZE >= gameState.paddleRightY &&
                gameState.ballY <= gameState.paddleRightY + PADDLE_HEIGHT) {
                gameState.ballSpeedX *= -1;
                gameState.ballX = GAME_WIDTH - 30 - BALL_SIZE;
                // Add spin based on where ball hits paddle
                const hitPos = (gameState.ballY + BALL_SIZE / 2) - (gameState.paddleRightY + PADDLE_HEIGHT / 2);
                gameState.ballSpeedY += hitPos * 0.05;
            }

            // Score points (ball goes off screen)
            if (gameState.ballX < 0) {
                gameState.computerScore++;
                resetBall();
            } else if (gameState.ballX > GAME_WIDTH) {
                gameState.playerScore++;
                resetBall();
            }
        }

        // Reset ball to center
        function resetBall() {
            gameState.ballX = GAME_WIDTH / 2 - BALL_SIZE / 2;
            gameState.ballY = GAME_HEIGHT / 2 - BALL_SIZE / 2;
            gameState.ballSpeedX = BALL_SPEED * (Math.random() > 0.5 ? 1 : -1);
            gameState.ballSpeedY = BALL_SPEED * (Math.random() > 0.5 ? 1 : -1);

            // Check win condition
            if (gameState.playerScore >= MAX_SCORE) {
                endGame(`🎉 YOU WIN! Final Score: ${gameState.playerScore} - ${gameState.computerScore}`);
            } else if (gameState.computerScore >= MAX_SCORE) {
                endGame(`💻 COMPUTER WINS! Final Score: ${gameState.playerScore} - ${gameState.computerScore}`);
            }
        }

        // End game
        function endGame(message) {
            gameState.gameActive = false;
            gameOverMessage.textContent = message;
            gameOverScreen.style.display = 'block';
        }

        // Render game
        function render() {
            paddleLeft.style.top = gameState.paddleLeftY + 'px';
            paddleRight.style.top = gameState.paddleRightY + 'px';
            ball.style.left = gameState.ballX + 'px';
            ball.style.top = gameState.ballY + 'px';
            playerScoreDisplay.textContent = gameState.playerScore;
            computerScoreDisplay.textContent = gameState.computerScore;
        }

        // Game loop
        function gameLoop() {
            if (gameState.gameActive) {
                updatePaddleWithKeys();
                updateAI();
                updateBall();
            }
            render();
            requestAnimationFrame(gameLoop);
        }

        // Start game
        gameLoop();
    </script>
</body>
</html>
